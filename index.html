function(){

document
.getElementById("sortSelect")
.value;

let list =
[...currentProducts];

if(value==="low"){

list.sort(
(a,b)=>a.price-b.price
);

}

if(value==="high"){

list.sort(
(a,b)=>b.price-a.price
);

}

list.sort(
(a,b)=>
a.name.localeCompare(b.name)
);

}

renderProducts(list);

};

========================================================= */

window.addToCart =
function(id){

const product =
products.find(
p=>p.id===id
);

const existing =
cart.find(
item=>item.id===id
);

if(existing){

existing.quantity++;

}else{

cart.push({

...product,

quantity:1

});

}

saveCart();

toast(
"Product added to cart."
);

};


window.buyNow =
function(id){

addToCart(id);

openCart();

};


function saveCart(){

localStorage.setItem(

"tn_cart",

JSON.stringify(cart)

);

renderCart();

}


window.renderCart =
function(){

const items =
document.getElementById(
"cartItems"
);

const count =
document.getElementById(
"cartCount"
);

const totalEl =
document.getElementById(
"cartTotal"
);

count.innerText =

cart.reduce(
(sum,item)=>
sum+item.quantity,
0
);

if(!cart.length){

items.innerHTML = `

<p
style="
text-align:center;
padding:40px
"
>

Your cart is empty.

</p>

`;

totalEl.innerText =
"0";

return;

}

let total=0;

items.innerHTML =

cart.map((item,index)=>{

total +=
item.price *
item.quantity;

return `

<div class="cart-item">

<img
src="${item.image}"
alt="${item.name}"
>

<div class="cart-item-info">

<strong>

${item.name}

</strong>

<p>

৳${item.price.toLocaleString()}

</p>

<div class="quantity-controls">

<button
onclick="changeQuantity(${index},-1)"
>

−

</button>

<span>

${item.quantity}

</span>

<button
onclick="changeQuantity(${index},1)"
>

+

</button>

<button
onclick="removeCart(${index})"
style="
margin-left:auto;
border:0;
background:none;
color:#ef4444
"
>

Remove

</button>

</div>

</div>

</div>

`;

}).join("");

totalEl.innerText =
total.toLocaleString();

};


window.changeQuantity =
function(index,change){

cart[index].quantity +=
change;

if(
cart[index].quantity<=0
){

cart.splice(index,1);

}

saveCart();

};


window.removeCart =
function(index){

window.placeOrder =
async function(){

const user =
auth.currentUser;

if(!user){

toast(
"Please login before placing an order."
);

closeModal(
"checkoutModal"
);

openAccount();

return;

}


const name =
document
.getElementById("orderName")
.value
.trim();

const phone =
document
.getElementById("orderPhone")
.value
.trim();

const address =
document
.getElementById("orderAddress")
.value
.trim();

const payment =
document
.querySelector(
'input[name="payment"]:checked'
)
.value;

const transaction =
document
.getElementById("transactionId")
.value
.trim();


if(
!name ||
!phone ||
!address
){

toast(
"Please complete delivery information."
);

return;

}


if(
(
payment==="bKash" ||
payment==="Nagad"
)
&&
!transaction
){

toast(
"Please enter Transaction ID."
);

return;

}


const total =
cart.reduce(

(sum,item)=>

sum+
item.price*
item.quantity,

0

);


try{

await addDoc(

collection(
db,
"orders"
),

{

userId:
user.uid,

userEmail:
user.email,

customerName:
name,

phone:

phone,

address:

address,

paymentMethod:

payment,

transactionId:

transaction,

items:

cart.map(item=>({

productId:
item.id,

name:
item.name,

price:
item.price,

quantity:
item.quantity,

image:
item.image

})),

total:

total,

status:

"Pending",

createdAt:

serverTimestamp()

}

);


cart=[];

saveCart();

closeModal(
"checkoutModal"
);

toast(
"Order placed successfully!"
);


document
.getElementById("orderName")
.value="";

document
.getElementById("orderPhone")
.value="";

document
.getElementById("orderAddress")
.value="";

document
.getElementById("transactionId")
.value="";


}catch(error){

console.error(error);

toast(
"Order failed. Please try again."
);

}

};


/* =========================================================
   SHOW CUSTOMER ORDERS
========================================================= */

window.showOrders =
async function(){

const user =
auth.currentUser;

if(!user){

return;

}

const content =
document
.getElementById(
"accountContent"
);

content.innerHTML =

`

<p>
Loading orders...
</p>

`;


try{

const q =

query(

collection(
db,
"orders"
),

where(
"userId",
"==",
user.uid
)

);


const snapshot =

await getDocs(q);


if(snapshot.empty){

content.innerHTML = `

<button
class="btn btn-outline"
onclick="renderAccount()"
>

← Back

</button>

<br><br>

<h2>
My Orders
</h2>

<p>
No orders yet.
</p>

`;

return;

}


let orders=[];

snapshot.forEach(doc=>{

orders.push({

id:
doc.id,

...doc.data()

});

});


orders.sort(

(a,b)=>{

const aTime =
a.createdAt?.seconds || 0;

const bTime =
b.createdAt?.seconds || 0;

return bTime-aTime;

}

);


content.innerHTML = `

<button
class="btn btn-outline"
onclick="renderAccount()"
>

← Back

</button>

<br><br>

<h2>
My Orders
</h2>

${

orders.map(o=>`

<div
style="
border:1px solid #ddd;
padding:15px;
border-radius:10px;
margin-top:12px
"
>

<strong>

Order #${o.id.slice(0,8)}

</strong>

<p>

Total:
৳${Number(o.total).toLocaleString()}

</p>

<p>

Payment:
${o.paymentMethod}

</p>

<p>

Status:

<b style="color:#16a34a">

${o.status}

</b>

</p>

</div>

`).join("")

}

`;

}catch(error){

console.error(error);

content.innerHTML = `

<p>
Unable to load orders.
</p>

`;

}

};
