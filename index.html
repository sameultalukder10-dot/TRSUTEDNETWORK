<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trusted Network | Category</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f6f8;
    color:#222;
}

/* HEADER */

header{
    background:white;
    padding:18px 5%;
    display:flex;
    align-items:center;
    gap:25px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:bold;
    color:#f85606;
}

.search{
    flex:1;
    display:flex;
}

.search input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:6px 0 0 6px;
}

.search button{
    padding:0 25px;
    border:none;
    background:#f85606;
    color:white;
    cursor:pointer;
}

.home{
    text-decoration:none;
    color:#222;
    font-weight:bold;
}

/* PAGE */

.container{
    width:90%;
    max-width:1400px;
    margin:35px auto;
}

.breadcrumb{
    color:#777;
    margin-bottom:20px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title h1{
    font-size:32px;
}

/* SUB CATEGORY */

.subcategories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.subcategory{
    background:white;
    padding:30px 15px;
    text-align:center;
    border-radius:12px;
    text-decoration:none;
    color:#222;
    border:1px solid #eee;
    transition:.25s;
}

.subcategory:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.subcategory h3{
    font-size:17px;
}

/* PRODUCTS */

.product-section{
    margin-top:45px;
}

.product-section h2{
    margin-bottom:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #eee;
}

.product-image{
    height:200px;
    background:#f1f2f4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin:8px 0;
    font-size:16px;
}

.brand{
    color:#777;
    font-size:13px;
}

.price{
    color:#f85606;
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.buy{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:none;
    background:#f85606;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:1000px){

    .subcategories{
        grid-template-columns:repeat(3,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    header{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    .subcategories{
        grid-template-columns:repeat(2,1fr);
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>
