<!-- RIFA & RIYA SPECIAL DISCOUNT -->
<div class="special-offer-card">
    <div class="offer-icon">🎁</div>

    <div class="offer-content">
        <span class="offer-label">SPECIAL OFFER</span>

        <h2>Rifa & Riya-এর জন্য বিশেষ অফার</h2>

        <p>
            আপনার জন্য থাকছে বিশেষ <strong>10% Discount</strong>!
        </p>

        <button onclick="claimSpecialDiscount()">
            🎉 Claim 10% OFF
        </button>
    </div>

    <div class="discount-badge">
        10%<br>
        <small>OFF</small>
    </div>
</div>

<style>
.special-offer-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 25px auto;
    padding: 25px 30px;
    max-width: 900px;
    background: linear-gradient(135deg, #1554d1, #7c3aed);
    color: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(21, 84, 209, 0.25);
    overflow: hidden;
}

.offer-icon {
    font-size: 50px;
}

.offer-content {
    flex: 1;
}

.offer-label {
    display: inline-block;
    padding: 5px 12px;
    background: rgba(255,255,255,.2);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

.offer-content h2 {
    margin: 8px 0;
    font-size: 24px;
}

.offer-content p {
    margin-bottom: 15px;
}

.offer-content button {
    border: none;
    padding: 11px 20px;
    border-radius: 10px;
    background: white;
    color: #1554d1;
    font-weight: 800;
    cursor: pointer;
}

.offer-content button:hover {
    transform: translateY(-2px);
}

.discount-badge {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ef4444;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 25px;
    font-weight: 900;
    transform: rotate(8deg);
}

.discount-badge small {
    font-size: 12px;
}

@media(max-width:600px) {
    .special-offer-card {
        margin: 20px 10px;
        padding: 20px;
    }

    .offer-icon {
        font-size: 35px;
    }

    .offer-content h2 {
        font-size: 18px;
    }

    .discount-badge {
        width: 70px;
        height: 70px;
        font-size: 20px;
    }
}
</style>

<script>
function claimSpecialDiscount() {
    const name = prompt(
        "Please enter your name to claim the 10% discount:"
    );

    if (!name) return;

    const customerName = name.trim().toLowerCase();

    if (
        customerName === "rifa" ||
        customerName === "riya"
    ) {
        alert(
            "🎉 Congratulations " +
            name +
            "! You have received a special 10% discount."
        );

        localStorage.setItem(
            "special_discount",
            JSON.stringify({
                name: name,
                discount: 10,
                active: true
            })
        );

    } else {
        alert(
            "Sorry! This special 10% discount is only available for Rifa and Riya."
        );
    }
}
</script>
