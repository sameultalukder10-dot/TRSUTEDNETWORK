<!-- Afsana 10% Discount -->
<div class="form-group">
    <label>Discount Code</label>

    <input
        id="discountCode"
        type="text"
        placeholder="Enter discount code"
    >

    <button
        class="btn btn-primary"
        style="margin-top:8px"
        onclick="applyDiscount()"
    >
        Apply Discount
    </button>

    <p
        id="discountMessage"
        style="margin-top:8px;font-weight:700"
    ></p>
</div>
